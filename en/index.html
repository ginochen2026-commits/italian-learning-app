<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>英语学习</title><style>

<script>
var pg=0,curB=0,WL=[],wi=0,ks=new Set,PL=[],pi=0,dL=[],di=0,dw=null,BANKS=[],CATS=[],_it='',_zh='';
var AB=location.hostname.includes('localhost')?'':'api.php';

function api(u,o){var op=o||{};op.headers=op.headers||{};op.headers['Content-Type']='application/json';var usr=localStorage.getItem('itu');if(usr){op.headers['X-User']=usr;u=u+(u.indexOf('?')>=0?'&':'?')+'u='+encodeURIComponent(usr)}return fetch(AB+u,op)}
function si(t){if(t&&window.speechSynthesis){window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;window.speechSynthesis.speak(u)}}
function sc(t){if(t&&window.speechSynthesis){window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.9;window.speechSynthesis.speak(u)}}

// RENDER
function show(){
 stopPl();
 var h='',ns=document.querySelectorAll('.nav span');
 for(var i=0;i<ns.length;i++)ns[i].className=i===pg?'on':'';
 if(pg===0)h='<select id="csk" onchange="catChg(this.value,0)"><option value="0">全部类</option></select> <select id="bsk" onchange="loadW(this.value)"><option value="0">全部词库</option></select><div class="st"><span id="ws">0/0</span></div><div class="bar"><div id="wf"></div></div><div class="card"><div class="pr" id="wp"></div><div class="wd" id="ww">-</div><div class="zh" id="wm"></div></div><div class="rw"><button class="btn w" onclick="sb(WL[wi])">🔊发音</button><button class="btn r" onclick="prevW()">⏮上一个</button><button class="btn g" onclick="nextW()">⏭下一个</button></div><div class="ab" style="padding:8px"><div style="display:flex;align-items:center;gap:6px;margin:4px 0"><span style="font-size:.8em">语速</span><select id="spd" onchange="playSpd=parseFloat(this.value)" style="width:auto;flex:1"><option value="1">正常</option><option value="0.8">慢</option><option value="0.6">很慢</option><option value="1.2">快</option></select><span style="font-size:.8em">间隔</span><select id="itv" onchange="playItv=parseFloat(this.value)" style="width:auto;flex:1"><option value="1">1秒</option><option value="0.5">0.5秒</option><option value="2">2秒</option><option value="3">3秒</option></select></div></div><div class="rw"><button class="btn w" onclick="plLoop(1)">🔁循环(意→中)</button><button class="btn w" onclick="plLoop(0)">🔁循环(中→意)</button></div>';
 if(pg===1)h='<select id="cdsk" onchange="catChg(this.value,1)"><option value="0">全部类</option></select> <select id="dsk" onchange="loadD(this.value)"><option value="0">全部词库</option></select><div class="st" id="dts">0/0</div><div class="ab"><div class="wd" id="d2">-</div><input id="di" placeholder="输入英文..." autocomplete="off"><div class="rw"><button class="btn g" onclick="ckD()">✓确认</button><button class="btn r" onclick="nxD()">→下一个</button><button class="btn w" onclick="dSay()">🔊发音</button><button class="btn g" id="dmb" onclick="toggleDM()">🔊只读意</button></div><div id="dh" style="display:none;margin-top:8px;padding:8px;border-radius:8px;text-align:center"></div></div>';
 if(pg===2)h='<div class="ab"><h3>翻译</h3><div id="trr" style="display:none;background:#008C45;border-radius:10px;padding:14px;text-align:center;margin-bottom:10px"><div class="wd" id="tq1">-</div></div><input id="tq" placeholder="输入英语或中文..."><div class="rw"><button class="btn g" onclick="doTr()">翻译</button></div><div id="tadd" style="display:none;margin-top:10px"><select id="tdd"><option value="0">默认</option></select><button class="btn g" onclick="ta()">+加入单词库</button></div></div>';
 if(pg===3)h='<select id="cmsk" onchange="catChg(this.value,2)"><option value="0">全部类</option></select> <select id="msk" onchange="loadM(this.value)"><option value="0">全部词库</option></select><div id="ml"></div>';
 if(pg===4)h='<div class="ab"><h3>添加单词</h3><input id="ni" placeholder="英语"><input id="nc" placeholder="中文"><select id="cask" onchange="catChg(this.value,3)"><option value="0">全部类</option></select> <select id="ask"><option value="0">默认</option></select><button class="btn g" style="width:100%;margin-top:6px" onclick="addW()">添加</button></div><div class="ab"><h3>批量添加</h3><textarea id="bi" placeholder="每行:英语,中文"></textarea><select id="cbask" onchange="catChg(this.value,4)"><option value="0">全部类</option></select> <select id="bask"><option value="0">默认</option></select><button class="btn g" style="width:100%;margin-top:6px" onclick="ba()">批量添加</button><div class="st" id="br"></div></div>';
 if(pg===5)h='<div class="st" id="dbg" style="color:#FFD700"></div><div class="ab"><h3>📁分类</h3><input id="cn" placeholder="新建分类..."><button class="btn g" style="width:100%;margin-top:6px" onclick="mkC()">+新建分类</button><div id="clist" style="margin-top:8px"></div></div><div class="ab"><h3>📚词库</h3><input id="bn" placeholder="新建词库..."><select id="bcid"><option value="0">未分类</option></select><button class="btn g" style="width:100%;margin-top:6px" onclick="mkB()">+新建词库</button><div id="blist" style="margin-top:10px"></div></div>';
 if(pg===6)h='<div class="ab" style="line-height:1.9"><h3>📚 学习</h3>选大类→选词库→看英语和中文。🔊发音读一遍，⏮/⏭翻页。<br>🔊循环播放：两种方向（意→中 / 中→意）一直循环，可调语速和间隔。</div><div class="ab" style="line-height:1.9"><h3>✏️ 听写</h3>看中文（或听语音），在框里输入英语。✓确认后显示对错。<br><b>三种模式</b>（点🔊只读意切换）：<br>🔊只读意 = 只读英语<br>🔉意+中 = 先意后中<br>🔉报中文 = 报中文你输入英语<br>完成后打分并列出错词，自动重报。</div><div class="ab" style="line-height:1.9"><h3>🌐 翻译</h3>输入英语或中文，自动识别方向。翻译后可「+加入单词库」存到词库。</div><div class="ab" style="line-height:1.9"><h3>➕ 添加单词</h3>单个：输入英语+中文，选词库，点添加。<br>批量：每行一个「英语,中文」（中英文逗号都行）。</div><div class="ab" style="line-height:1.9"><h3>📦 词库</h3>先建「分类」（如：名词），再建「词库」并选分类。词库可改类/改名/删除。</div><div class="ab" style="line-height:1.9"><h3>📝 管理</h3>按词库查看单词，可删除单个单词。</div><div class="ab" style="line-height:1.9"><h3>💡 提示</h3>• 每个用户词库独立，互不影响。<br>• 全部播放时屏幕不会自动关。<br>• 换页面会停止播放。</div><div class="st" style="margin-top:10px">📞 微信: vdg8518</div>';
 if(pg===7)h='<div class="ab"><h3>💬 聊天 / 建议</h3><div id="fbList" style="max-height:55vh;overflow-y:auto"></div><textarea id="fbInput" placeholder="发建议或聊天..." style="margin-top:10px"></textarea><button class="btn g" style="width:100%;margin-top:6px" onclick="sendFb()">发送</button></div>';
 document.getElementById('main').innerHTML=h;
 fillBs();
 if(pg===0)loadW(curB||0);
 if(pg===1)loadD(curB||0);
 if(pg===3)loadM(curB||0);
 if(pg===5)ldBs();
 if(pg===7)ldFb();
}

function fillBs(){
var ch='<option value=\"0\">全部类</option>';
for(var i=0;i<CATS.length;i++)ch+='<option value=\"'+CATS[i].id+'\">'+CATS[i].name+'</option>';
['csk','cdsk','cmsk','cask','cbask'].forEach(function(id){var e=document.getElementById(id);if(e)e.innerHTML=ch});
catChg(0,0);catChg(0,1);catChg(0,2);catChg(0,3);catChg(0,4);
var bh='<option value=\"0\">默认</option>';
for(var i=0;i<BANKS.length;i++)bh+='<option value=\"'+BANKS[i].id+'\">'+BANKS[i].name+'</option>';
['ask','bask','tdd'].forEach(function(id){var e=document.getElementById(id);if(e){var v=e.value;e.innerHTML=bh;if(v)e.value=v}});
}
function catChg(cid,type){cid=parseInt(cid)||0;var target=type===0?'bsk':type===1?'dsk':type===2?'msk':type===3?'ask':'bask';var firstLbl=type>=3?'默认':'全部词库';var h='<option value=\"0\">'+firstLbl+'</option>';for(var i=0;i<BANKS.length;i++){if(cid===0||(BANKS[i].category_id||0)===cid)h+='<option value=\"'+BANKS[i].id+'\">'+BANKS[i].name+'</option>'}var tg=document.getElementById(target);if(tg)tg.innerHTML=h}
// WORDS
function loadW(b){curB=parseInt(b);var u=b>0?'/api/words/'+b:'/api/words';api(u).then(function(r){return r.json()}).then(function(w){WL=w;wi=0;ks=new Set;swW()}).catch(function(e){document.getElementById('ws').textContent='ERR'})}
function swW(){if(!WL.length){document.getElementById('ww').textContent='暂无';return}var w=WL[wi];document.getElementById('wp').textContent=w.pronunciation||'';document.getElementById('ww').textContent=w.italian;document.getElementById('wm').textContent=w.chinese;document.getElementById('ws').textContent=ks.size+'/'+WL.length;document.getElementById('wf').style.width=(ks.size/WL.length*100)+'%'}
function nextW(){if(!WL.length)return;ks.add(wi);wi=(wi+1)%WL.length;swW();sb(WL[wi])}
function prevW(){if(!WL.length)return;wi=(wi-1+WL.length)%WL.length;swW();sb(WL[wi])}
var plD=null,plS=0,plWake=null,playSpd=1,playItv=1;
function stopPl(){plS=1;window.speechSynthesis.cancel();if(plD){plD.remove();plD=null}if(plWake){plWake.release();plWake=null}var ww=document.getElementById('ww'),wm=document.getElementById('wm');if(ww)ww.style.fontSize='';if(wm)wm.style.fontSize=''}
function plLoop(dir){if(!WL.length)return;stopPl();plS=0;if(navigator.wakeLock){navigator.wakeLock.request('screen').then(function(w){plWake=w})}var card=document.querySelector('.card');if(card){var stb=document.createElement('button');stb.className='btn r';stb.textContent='⏹停止';stb.onclick=stopPl;stb.style.cssText='margin-top:8px;padding:5px 12px;font-size:.7em';plD=stb;card.appendChild(stb)}var i=0;function n(){if(plS){stopPl();return}var w=WL[i%WL.length];var ww=document.getElementById('ww'),wm=document.getElementById('wm'),wp=document.getElementById('wp');if(ww){ww.textContent=w.italian;ww.style.fontSize='2.6em'}if(wm){wm.textContent=w.chinese;wm.style.fontSize='1.6em'}if(wp)wp.textContent='';var ws=document.getElementById('ws'),wf=document.getElementById('wf');if(ws)ws.textContent=(i%WL.length+1)+'/'+WL.length;if(wf)wf.style.width=((i%WL.length+1)/WL.length*100)+'%';var first=dir?w.italian:w.chinese;var second=dir?w.chinese:w.italian;var a=new SpeechSynthesisUtterance(first);a.lang=dir?'en-US':'zh-CN';a.rate=playSpd*.85;a.onend=function(){var b=new SpeechSynthesisUtterance(second);b.lang=dir?'zh-CN':'en-US';b.rate=playSpd*.9;b.onend=function(){setTimeout(function(){i++;n()},playItv*1000)};b.onerror=function(){i++;n()};window.speechSynthesis.speak(b)};a.onerror=function(){i++;n()};window.speechSynthesis.speak(a)}window.speechSynthesis.cancel();n()}
// DICTATION
function loadD(b){api('/api/words'+(b>0?'/'+b:'')).then(function(r){return r.json()}).then(function(l){dL=l.sort(function(){return Math.random()-.5});di=0;dw=null;document.getElementById('dts').textContent='0/'+dL.length;nxD()})}
var dMode=0,dWrong=[];
function toggleDM(){dMode=(dMode+1)%4;var t=['🔊只读意','🔉意+中','🔉报中文','🔉报意输中'][dMode];document.getElementById('dmb').textContent=t;dL=dL.sort(function(){return Math.random()-.5});di=0;dw=null;dWrong=[];nxD()}
function nxD(){if(di>=dL.length){var s=dWrong.length;var tot=dL.length;var pct=Math.round((tot-s)/tot*100);var t=document.getElementById('d2');var m=pct>=80?'🎉 优秀！':pct>=60?'👍 不错':'💪 继续加油';t.innerHTML=m+'<br><span style="font-size:.7em;opacity:.7">'+pct+'分 ('+(tot-s)+'/'+tot+')</span>';if(dWrong.length){t.innerHTML+='<br><br><span style="font-size:.8em">❌错误单词:</span><br>'+dWrong.map(function(w){return w.i+' → '+w.c}).join('<br>');api('/api/dict_wrong',{method:'POST',body:JSON.stringify({words:dWrong})});setTimeout(function(){replayWrong()},500)}document.getElementById('dts').textContent=tot+'/'+tot;return}dw=dL[di];di++;var inp=document.getElementById('di');document.getElementById('d2').textContent=dMode===3?dw.italian:dw.chinese;inp.placeholder=dMode===3?'输入中文...':'输入英文...';document.getElementById('dts').textContent=di+'/'+dL.length;inp.value='';document.getElementById('dh').style.display='none';window.speechSynthesis.cancel();if(dMode===2){sc(dw.chinese)}else if(dMode===3){var a=new SpeechSynthesisUtterance(dw.italian);a.lang='en-US';a.rate=.85;window.speechSynthesis.speak(a)}else{var a=new SpeechSynthesisUtterance(dw.italian);a.lang='en-US';a.rate=.85;if(dMode===1){a.onend=function(){sc(dw.chinese)}};window.speechSynthesis.speak(a)}}
function ckD(){var a=document.getElementById('di').value.trim();if(!a||!dw)return;var ok=false;if(dMode===3){ok=(a===dw.chinese);if(!ok)dWrong.push({i:dw.italian,c:dw.chinese})}else{var a2=a.toLowerCase(),c=dw.italian.toLowerCase();ok=(a2===c);if(!ok){var m=[];for(var i=0;i<=c.length;i++){m[i]=[i]}for(var j=0;j<=a2.length;j++)m[0][j]=j;for(var i=1;i<=c.length;i++)for(var j=1;j<=a2.length;j++)m[i][j]=c[i-1]===a2[j-1]?m[i-1][j-1]:1+Math.min(m[i-1][j-1],m[i][j-1],m[i-1][j]);ok=m[c.length][a2.length]<=1}if(!ok)dWrong.push({i:dw.italian,c:dw.chinese})}document.getElementById('di').style.borderColor=ok?'#008C45':'#CD212A';var dh=document.getElementById('dh');dh.style.display='block';dh.style.background=ok?'rgba(0,140,69,.4)':'rgba(205,33,42,.4)';var ans=dMode===3?dw.chinese:dw.italian;dh.innerHTML=ok?'<span style="font-size:2em">✅ '+ans+'</span>':'<span style="font-size:2em">❌ '+ans+'</span>';si(dw.italian)}
function dSay(){if(!dw)return;if(dMode===2)sc(dw.chinese);else si(dw.italian)}
function replayWrong(){if(!dWrong.length)return;var i=0;function p(){if(i>=dWrong.length)return;var it=dWrong[i].i||'',zh=dWrong[i].c||'';var a=new SpeechSynthesisUtterance(it);a.lang='en-US';a.rate=.85;a.onend=function(){sc(zh);setTimeout(function(){i++;p()},1000)};window.speechSynthesis.speak(a)}window.speechSynthesis.cancel();p()}
// TRANSLATION
function doTr(){var q=document.getElementById('tq').value.trim();if(!q)return;document.getElementById('trr').style.display='block';document.getElementById('tq1').textContent='...';api('/api/tr?q='+encodeURIComponent(q)+'&_='+Date.now()).then(function(r){return r.json()}).then(function(d){if(d.ok){document.getElementById('tq1').textContent=d.r;document.getElementById('tadd').style.display='block';var cn=false;for(var i=0;i<q.length;i++)if(q.charCodeAt(i)>0x4e00){cn=true;break}_it=cn?d.r:q;_zh=cn?q:d.r;si(_it)}})}
function ta(){if(!_it||!_zh)return;var bid=parseInt(document.getElementById('tdd').value)||0;api('/api/add_word',{method:'POST',body:JSON.stringify({i:_it,c:_zh,bank:bid})}).then(function(r){return r.json()}).then(function(r){if(r.ok)alert('已加入');else alert(r.e)})}

// MANAGEMENT
function loadM(b){if(b!==undefined)curB=parseInt(b);api('/api/words'+(curB>0?'/'+curB:'')).then(function(r){return r.json()}).then(function(l){var e=document.getElementById('ml'),h='';if(!l||!l.length){e.innerHTML='<div class="st">暂无</div>';return}curWords=l;for(var i=0;i<l.length;i++)h+='<div style="background:#16213e;border-radius:8px;padding:8px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;border-left:4px solid #008C45"><div><b>'+l[i].italian+'</b><br><span style="opacity:.8">'+l[i].chinese+'</span></div><span><button class="btn g" style="padding:3px 7px;font-size:.7em" onclick="editW('+l[i].id+')">✏️</button> <button class="btn r" style="padding:3px 7px;font-size:.7em" onclick="delW('+l[i].id+')">✕</button></span></div>';e.innerHTML=h})}
function delW(id){if(!confirm('删除？'))return;api('/api/del_word',{method:'POST',body:JSON.stringify({id:id})}).then(function(){loadM()})}
var curWords=[];function editW(id){var w=null;for(var i=0;i<curWords.length;i++){if(curWords[i].id===id){w=curWords[i];break}}if(!w)return;var nit=prompt('英语：',w.italian);if(nit===null||nit.trim()==='')return;var nzh=prompt('中文：',w.chinese);if(nzh===null)return;api('/api/word_update',{method:'POST',body:JSON.stringify({id:id,italian:nit,chinese:nzh})}).then(function(){loadM()})}

// ADD
function addW(){var i=document.getElementById('ni').value.trim(),c=document.getElementById('nc').value.trim();if(!i||!c)return;var bid=parseInt(document.getElementById('ask').value)||0;api('/api/add_word',{method:'POST',body:JSON.stringify({i:i,c:c,bank:bid})}).then(function(r){return r.json()}).then(function(r){if(r.ok){document.getElementById('ni').value='';document.getElementById('nc').value='';alert('已添加')}else alert(r.e)})}
function ba(){var t=document.getElementById('bi'),br=document.getElementById('br'),s=t.value.trim();if(!s)return;var ls=s.split('\n').filter(function(x){return x.trim()});if(!ls.length)return;var bid=parseInt(document.getElementById('bask').value)||0,tot=ls.length,ok=0;br.textContent='0/'+tot;function n(i){if(i>=tot){br.textContent='完成:'+ok+'/'+tot;t.value='';return}var p=ls[i].trim().split(/[;；]/),it=(p[0]||'').trim(),zh=p.slice(1).join(';').trim();if(!it||!zh){n(i+1);return}api('/api/add_word',{method:'POST',body:JSON.stringify({i:it,c:zh,bank:bid})}).then(function(r){return r.json()}).then(function(r){ok++;br.textContent=ok+'/'+tot;n(i+1)}).catch(function(){n(i+1)})}n(0)}

// BANKS
function mkB(){var n=document.getElementById('bn').value.trim();if(!n)return;var cid=parseInt(document.getElementById('bcid').value)||0;api('/api/bank_create',{method:'POST',body:JSON.stringify({name:n,category_id:cid})}).then(function(){document.getElementById('bn').value='';ldBs()})}
function mkC(){var n=document.getElementById('cn').value.trim();if(!n)return;api('/api/cat_create',{method:'POST',body:JSON.stringify({name:n})}).then(function(){document.getElementById('cn').value='';ldBs()})}
function delB(id){if(!confirm('删除词库？词库内单词会移到默认'))return;api('/api/bank_delete',{method:'POST',body:JSON.stringify({id:id})}).then(function(){ldBs()})}
function delC(id){if(!confirm('删除分类？分类下词库会移到未分类'))return;api('/api/cat_delete',{method:'POST',body:JSON.stringify({id:id})}).then(function(){ldBs()})}
function rnB(id){var b=null;for(var i=0;i<BANKS.length;i++)if(BANKS[i].id===id)b=BANKS[i];var n=prompt('新名:',b?b.name:'');if(!n)return;api('/api/bank_rename',{method:'POST',body:JSON.stringify({id:id,name:n})}).then(function(){ldBs()})}
function mvB(id){var b=null;for(var i=0;i<BANKS.length;i++)if(BANKS[i].id===id)b=BANKS[i];var opts='0:未分类';for(var i=0;i<CATS.length;i++)opts+='\n'+CATS[i].id+':'+CATS[i].name;var cid=prompt('输入分类编号(0=未分类):\n'+opts,b?b.category_id:0);if(cid===null)return;cid=parseInt(cid)||0;api('/api/bank_move',{method:'POST',body:JSON.stringify({id:id,category_id:cid})}).then(function(){ldBs()})}
function rnC(id){var b=null;for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)b=CATS[i];var n=prompt('新名:',b?b.name:'');if(!n)return;api('/api/cat_rename',{method:'POST',body:JSON.stringify({id:id,name:n})}).then(function(){ldBs()})}
function tgCat(id,el){var e=document.getElementById('g'+id);if(e){var hidden=e.style.display==='none';e.style.display=hidden?'block':'none';el.textContent=(hidden?'▾':'▸')+el.textContent.slice(1)}}
function listB(){var e=document.getElementById('blist');if(!e)return;var catsById={};for(var i=0;i<CATS.length;i++)catsById[CATS[i].id]=CATS[i].name;var grouped={};for(var i=0;i<BANKS.length;i++){var cid=BANKS[i].category_id||0;if(!grouped[cid])grouped[cid]=[];grouped[cid].push(BANKS[i])}var keys=Object.keys(grouped);var h='';for(var k=0;k<keys.length;k++){var cid=keys[k];var label=cid==0?'未分类':catsById[cid]||'未分类';var cnt=grouped[cid].length;h+='<div style="margin:8px 0 3px;color:#FFD700;font-weight:700;font-size:.9em;cursor:pointer" onclick="tgCat('+cid+',this)">▾ 📁 '+label+' ('+cnt+')</div><div id="g'+cid+'" style="padding-left:16px">';for(var j=0;j<grouped[cid].length;j++){var bk=grouped[cid][j];h+='<div style="background:#16213e;border-radius:8px;padding:8px;margin:4px 0;display:flex;justify-content:space-between"><b>'+bk.name+'</b><span><button class="btn w" style="padding:3px 6px;font-size:.65em;margin-right:3px" onclick="mvB('+bk.id+')">改类</button><button class="btn w" style="padding:3px 6px;font-size:.65em;margin-right:3px" onclick="rnB('+bk.id+')">改名</button><button class="btn r" style="padding:3px 6px;font-size:.65em" onclick="delB('+bk.id+')">删除</button></span></div>'}h+='</div>'}e.innerHTML=h||'<div class="st">暂无词库</div>'}
function ldCatList(){var e=document.getElementById('clist');if(e){var h='';for(var i=0;i<CATS.length;i++)h+='<div style="background:#1a1a3e;border-radius:8px;padding:8px;margin:4px 0;display:flex;justify-content:space-between"><b>'+CATS[i].name+'</b><span><button class="btn w" style="padding:3px 6px;font-size:.65em;margin-right:3px" onclick="rnC('+CATS[i].id+')">改名</button><button class="btn r" style="padding:3px 6px;font-size:.65em" onclick="delC('+CATS[i].id+')">删除</button></span></div>';e.innerHTML=h||'<div class="st">暂无分类</div>'}var bc=document.getElementById('bcid');if(bc){var oh='<option value="0">未分类</option>';for(var j=0;j<CATS.length;j++)oh+='<option value="'+CATS[j].id+'">'+CATS[j].name+'</option>';bc.innerHTML=oh}}
function ldBs(){api('/api/banks').then(function(r){return r.json()}).then(function(b){BANKS=b||[];return api('/api/categories').then(function(r2){return r2.json()}).then(function(c){CATS=c||[];var dg=document.getElementById('dbg');if(dg)dg.textContent='词库:'+BANKS.length+' 分类:'+CATS.length;fillBs();listB();ldCatList()})}).catch(function(e){var dg=document.getElementById('dbg');if(dg)dg.textContent='加载失败:'+e;if(typeof listB==='function')listB();if(typeof ldCatList==='function')ldCatList()})}
// FEEDBACK
function ldFb(){api('/api/feedback').then(function(r){return r.json()}).then(function(f){var e=document.getElementById('fbList');if(!e)return;var h='';for(var i=0;i<f.length;i++){h+='<div style="background:#16213e;border-radius:8px;padding:8px;margin:5px 0"><b>'+f[i].username+'</b> <span style="opacity:.5;font-size:.7em">'+f[i].created_at+'</span><br>'+f[i].content+'</div>'}e.innerHTML=h||'<div class="st">还没有留言</div>'})}
function sendFb(){var t=document.getElementById('fbInput');var c=t.value.trim();if(!c)return;api('/api/feedback_add',{method:'POST',body:JSON.stringify({content:c})}).then(function(r){return r.json()}).then(function(d){if(d.ok){t.value='';ldFb()}else alert(d.e)})}
function showUsers(){api('/api/admin_users').then(function(r){return r.json()}).then(function(d){if(d.e){alert(d.e);return}var h='';for(var i=0;i<d.length;i++){var u=d[i];h+='<div style="background:#1a1a3e;border-radius:8px;padding:10px;margin:6px 0"><b>'+(u.is_admin?'👑':'👤')+u.username+'</b> <span style="opacity:.6;font-size:.75em">ID:'+u.id+'</span><br><span style="font-size:.8em">📧 '+(u.email||'无')+'</span><br><span style="font-size:.8em">单词:'+u.wc+' 词库:'+u.bc+' 分类:'+u.cc+'</span></div>'}document.getElementById('ulist').innerHTML=h||'<div class="st">无用户</div>';document.getElementById('ul').style.display='flex'})}
// LOGIN
function login(){var u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value.trim();api('/api/login',{method:'POST',body:JSON.stringify({u:u,p:p})}).then(function(r){return r.json()}).then(function(d){if(d.ok){document.getElementById('lo').style.display='none';document.getElementById('uname').textContent='👤'+d.u;localStorage.setItem('itu',d.u);localStorage.setItem('itadm',d.adm||0);document.getElementById('admBtn').style.display=d.adm?'block':'none';ldBs()}else{var e=document.getElementById('lm');e.style.display='block';e.textContent=d.e}})}
function toggleAuth(){var rf=document.getElementById('rf');var isReg=rf.style.display==='none';rf.style.display=isReg?'block':'none';document.getElementById('lbtn').style.display=isReg?'none':'block';document.getElementById('lt').textContent=isReg?'注册':'登录';document.getElementById('ta').textContent=isReg?'已有账号？登录':'没有账号？注册';document.getElementById('lm').style.display='none'}
function reg2(){var u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value.trim(),p2=document.getElementById('rpw2').value.trim(),e=document.getElementById('rem').value.trim();var lm=document.getElementById('lm');if(p!==p2){lm.style.display='block';lm.textContent='两次密码不一致';return}api('/api/register',{method:'POST',body:JSON.stringify({u:u,p:p,p2:p2,e:e})}).then(function(r){return r.json()}).then(function(d){if(d.ok){document.getElementById('lo').style.display='none';document.getElementById('uname').textContent='👤'+d.u;localStorage.setItem('itu',d.u);localStorage.setItem('itadm',d.adm||0);document.getElementById('admBtn').style.display=d.adm?'block':'none';ldBs();show()}else{lm.style.display='block';lm.textContent=d.e}})}
function logout(){api('/api/logout',{method:'POST'});localStorage.removeItem('itu');location.reload()}

// INIT
(function(){
 var u=localStorage.getItem('itu');
 if(u){document.getElementById('uname').textContent='👤'+u;document.getElementById('lo').style.display='none';if(localStorage.getItem('itadm')==='1')document.getElementById('admBtn').style.display='block'}
 else{document.getElementById('lo').style.display='flex'}
 ldBs();show();
})();
</script></body></html>
